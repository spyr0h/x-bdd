version: 2.1

orbs:
  docker: circleci/docker@2.7.0

jobs:
  step_one_approval_setup_server:
    type: approval

  step_two_approval_configure_nginx:
    type: approval

  step_three_approval_generate_ssl_certificate:
    type: approval

  step_four_approval_push_docker_compose_file:
    type: approval

  step_five_approval_docker_compose_up:
    type: approval

  step_six_approval_configure_firewall:
    type: approval

  step_seven_approval_setup_vpn:
    type: approval

  setup-server:
    executor:
      name: docker/docker
      tag: "3.9"
    steps:
      - run:
          name: Display CircleCI environment variables
          command: |
            echo "Displaying CircleCI environment variables"
            printenv
      - run:
          name: Install Dependencies (Nginx, Certbot) if not installed
          command: |
            ssh -oStrictHostKeyChecking=no $SSHUSER@$SSHHOST "bash -c '
              if ! command -v nginx &> /dev/null; then
                echo "Installing Nginx..."
                sudo apt update && sudo apt install -y nginx
                sudo systemctl enable --now nginx
              else
                echo "Nginx already installed. Skipping..."
              fi

              if ! command -v certbot &> /dev/null; then
                echo "Installing Certbot..."
                sudo apt install -y certbot python3-certbot-nginx
              else
                echo "Certbot already installed. Skipping..."
              fi
            '"

  configure-nginx:
    executor:
      name: docker/docker
      tag: "3.6"
    steps:
      - run:
          name: Deploy Nginx Configuration with DDoS Protection
          command: |
            - run:
    name: Deploy Nginx Configuration
    command: |
      ssh -oStrictHostKeyChecking=no $SSHUSER@$SSHHOST "cat <<'EOF' | sudo tee /etc/nginx/sites-available/api.conf
      server {
          listen 443 ssl;
          server_name x-api.ovh www.x-api.ovh;
          
          ssl_certificate /etc/letsencrypt/live/x-api.ovh/fullchain.pem;
          ssl_certificate_key /etc/letsencrypt/live/x-api.ovh/privkey.pem;
          include /etc/letsencrypt/options-ssl-nginx.conf;
          ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
          
          # Let's Encrypt challenge
          location /.well-known/acme-challenge/ {
              root /var/lib/letsencrypt/;
          }

          # Proxy vers ton API
          location / {
              proxy_pass http://localhost:8080;
              proxy_set_header Host \$host;
              proxy_set_header X-Real-IP \$remote_addr;
              proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
          }
      }
      
      server {
          listen 80;
          server_name x-api.ovh www.x-api.ovh;
      
          location /.well-known/acme-challenge/ {
              root /var/lib/letsencrypt/;
          }
      
          return 301 https://\$host\$request_uri;
      }
      EOF

      sudo ln -sf /etc/nginx/sites-available/api.conf /etc/nginx/sites-enabled/api.conf
      sudo nginx -t && sudo systemctl restart nginx
      echo \"Nginx configuration applied successfully!\"
      "


  generate-ssl-certificate:
    executor:
      name: docker/docker
      tag: "3.9"
    steps:
      - run:
          name: Generate SSL Certificate if not exists
          command: |
            ssh -oStrictHostKeyChecking=no $SSHUSER@$SSHHOST "bash -c '
              sudo mkdir -p /var/lib/letsencrypt/.well-known/acme-challenge/
              sudo chown -R www-data:www-data /var/lib/letsencrypt/
              sudo chmod -R 755 /var/lib/letsencrypt/
            '"
            ssh -oStrictHostKeyChecking=no $SSHUSER@$SSHHOST "export DOMAIN=$DOMAIN EMAIL=$EMAIL && bash -c '
              CERT_FILE=\"/etc/letsencrypt/live/$DOMAIN/fullchain.pem\"
              if [ ! -f \"$CERT_FILE\" ]; then
                echo \"Generating SSL Certificate...\"
                sudo certbot certonly --webroot -w /var/lib/letsencrypt/ \
                  -d $DOMAIN -d www.$DOMAIN \
                  --non-interactive --agree-tos -m $EMAIL
              else
                echo \"Renewing certificate...\"
                sudo certbot renew --quiet
              fi
            '"

  push-docker-compose-file:
    executor:
      name: docker/docker
      tag: "3.9"
    steps:
      - checkout
      - run:
          name: Generate .env file
          command: |
            echo "X_ROOT_PWD=$X_ROOT_PWD" > .env
            echo "X_BDD=$X_BDD" >> .env
            echo "X_BDD_USER=$X_BDD_USER" >> .env
            echo "X_BDD_PWD=$X_BDD_PWD" >> .env
      - run:
          name: Push Docker Compose File
          command: |
            scp -oStrictHostKeyChecking=no docker-compose.yml $SSHUSER@$SSHHOST:~/x-bdd/
            scp -oStrictHostKeyChecking=no .env $SSHUSER@$SSHHOST:~/x-bdd/

  docker-compose-up:
    executor:
      name: docker/docker
      tag: "3.9"
    steps:
      - run:
          name: Restart Docker Services
          command: |
            ssh -oStrictHostKeyChecking=no $SSHUSER@$SSHHOST 'docker compose -f ~/x-bdd/docker-compose.yml down'
            ssh -oStrictHostKeyChecking=no $SSHUSER@$SSHHOST 'docker compose -f ~/x-bdd/docker-compose.yml up -d --build'

  configure-firewall:
    executor:
      name: docker/docker
      tag: "3.9"
    steps:
      - run:
          name: Install UFW if not installed
          command: |
            ssh -oStrictHostKeyChecking=no $SSHUSER@$SSHHOST "bash -c '
              if ! command -v ufw &> /dev/null; then
                echo "Installing UFW..."
                sudo apt update && sudo apt install -y ufw
              else
                echo "UFW already installed. Skipping..."
              fi
            '"
      - run:
          name: Configure Firewall (UFW)
          command: |
            ssh -oStrictHostKeyChecking=no $SSHUSER@$SSHHOST "bash -c '
              echo \"Setting up firewall...\"

              # Réinitialisation UFW
              sudo ufw --force reset
              sudo ufw --force disable
              
              # Autorisation des ports nécessaires
              sudo ufw allow 22/tcp      # SSH
              sudo ufw allow 51820/udp   # WireGuard VPN
              sudo ufw allow 80/tcp      # HTTP
              sudo ufw allow 443/tcp     # HTTPS
              sudo ufw allow 8080/tcp    # BASE

              sudo ufw allow from 127.0.0.1 to 127.0.0.1 port 8080 proto tcp
              
              # Bloquer tous les autres ports entrants
              sudo ufw default deny incoming
              
              # Autoriser toutes les connexions sortantes
              sudo ufw default allow outgoing

              # Créer la chaine si elle n'existe pas
              sudo iptables -t filter -C DOCKER-USER -j RETURN 2>/dev/null || sudo iptables -t filter -N DOCKER-USER && sudo iptables -t filter -A DOCKER-USER -j RETURN

              # Flush règles DOCKER-USER
              sudo iptables -F DOCKER-USER

              # Autoriser laccès depuis le VPN (adapte lIP si nécessaire)
              sudo iptables -I DOCKER-USER -s 10.0.0.0/24 -j ACCEPT  

              # Autoriser tout le trafic interne Docker (sans se soucier des interfaces réseau)
              sudo iptables -I DOCKER-USER -i br+ -j ACCEPT  
              sudo iptables -I DOCKER-USER -o br+ -j ACCEPT  

              # Bloquer tout accès direct aux services sensibles depuis lextérieur sauf localhost
              sudo iptables -I DOCKER-USER -p tcp --dport 3000 ! -s 127.0.0.1 -j REJECT
              sudo iptables -I DOCKER-USER -p tcp --dport 48152 ! -s 127.0.0.1 -j REJECT
              sudo iptables -I DOCKER-USER -p tcp --dport 3306 ! -s 127.0.0.1 -j REJECT
              sudo iptables -I DOCKER-USER -p tcp --dport 3100 ! -s 127.0.0.1 -j REJECT
              sudo iptables -I DOCKER-USER -p tcp --dport 9090 ! -s 127.0.0.1 -j REJECT

              # Persist even if the server reload
              sudo iptables-save > /etc/iptables/rules.v4
              
              # Activer le firewall sans confirmation
              sudo systemctl restart ufw
              sudo ufw --force enable
              
              # Afficher le statut du firewall
              sudo ufw status verbose

              echo \"Firewall configured successfully!\"
            '"

  setup-vpn:
    executor:
      name: docker/docker
      tag: "3.9"
    steps:
      - run:
          name: Install WireGuard
          command: |
            ssh -oStrictHostKeyChecking=no $SSHUSER@$SSHHOST "bash -c '
              if ! command -v wg &> /dev/null; then
                echo \"Installing WireGuard...\"
                sudo apt update && sudo apt install -y wireguard
              else
                echo \"WireGuard already installed. Skipping...\"
              fi
            '"
      - run:
          name: Configure WireGuard Server
          command: |
            ssh -oStrictHostKeyChecking=no $SSHUSER@$SSHHOST "export WIREGUARD_SERVER_PRIVATE_KEY=$WIREGUARD_SERVER_PRIVATE_KEY WIREGUARD_CLIENT_PUBLIC_KEY=$WIREGUARD_CLIENT_PUBLIC_KEY && bash -c '
              sudo mkdir -p /etc/wireguard
              echo \"Setting up WireGuard server...\"

              # Utilisation des clés injectées depuis CircleCI
              echo \"$WIREGUARD_SERVER_PRIVATE_KEY\" | sudo tee /etc/wireguard/server_private.key > /dev/null
              sudo chmod 600 /etc/wireguard/server_private.key

              # Création du fichier de configuration WireGuard
              sudo bash -c \"cat > /etc/wireguard/wg0.conf\"  \<<EOF
              [Interface]
              Address = 10.0.0.1/24
              ListenPort = 51820
              PrivateKey = $(cat /etc/wireguard/server_private.key)
              PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
              PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

              [Peer]
              PublicKey = $WIREGUARD_CLIENT_PUBLIC_KEY
              AllowedIPs = 10.0.0.2/32

              EOF

              # Activation et démarrage du service
              sudo chmod 600 /etc/wireguard/wg0.conf
              sudo systemctl enable --now wg-quick@wg0
              echo \"WireGuard server configured and started!\"
            '"

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - step_one_approval_setup_server
      - setup-server:
          requires:
            - step_one_approval_setup_server
      - step_two_approval_configure_nginx
      - configure-nginx:
          requires:
            - step_two_approval_configure_nginx
      - step_three_approval_generate_ssl_certificate
      - generate-ssl-certificate:
          requires:
            - step_three_approval_generate_ssl_certificate
      - step_four_approval_push_docker_compose_file
      - push-docker-compose-file:
          requires:
            - step_four_approval_push_docker_compose_file
      - step_five_approval_docker_compose_up
      - docker-compose-up:
          requires:
            - step_five_approval_docker_compose_up
      - step_six_approval_configure_firewall
      - configure-firewall:
          requires:
            - step_six_approval_configure_firewall
      - step_seven_approval_setup_vpn
      - setup-vpn:
          requires:
            - step_seven_approval_setup_vpn
